name: Selenium Automation CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  run-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run Maven TestNG Suite (Headless Chrome)
        run: mvn clean test -Dsuite.file=testng.xml -Dheadless=true

      - name: Upload ExtentReport & Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ExtentReport-Dashboard
          path: |
            target/extent-reports/
            target/surefire-reports/screenshots/
